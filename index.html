<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daymark — Practice</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173745;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;background:#e8f0eb;color:#173745;cursor:pointer;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid #1c9479;outline-offset:2px}button:hover{filter:brightness(.97)}button.selected,.btnprimary{background:#164458;color:#fff}button.positive{background:#dff5e8;color:#176b46}button.correction{background:#ffede4;color:#a64d3f}button.checkin{background:#e1ecf9;color:#315d91}.container{max-width:1160px;margin:auto;padding:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:24px;font-weight:850;letter-spacing:-.7px}.sun{background:#143e51;color:#c6edd4;padding:8px;border-radius:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#62817e;font-weight:700}.sub{color:#697b7f;font-size:13px}.chip{display:inline-block;padding:6px 10px;background:#fff1cc;color:#695526;font-size:12px;border-radius:50px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}.card{background:white;border-radius:19px;padding:19px;margin-bottom:15px;border:1px solid #e2eae5;box-shadow:0 4px 18px #174b3b08}h1{font-size:29px;margin:12px 0 5px;letter-spacing:-1px}h2{font-size:18px;margin:0 0 12px}.hero{background:#173f50;color:white}.hero .eyebrow,.hero .sub{color:#bcdddf}.hero h2{font-size:24px;margin:12px 0}.task{padding:10px 0;border-bottom:1px solid #ebf1ec;display:flex;align-items:center;gap:11px;justify-content:space-between}.task label{display:flex;align-items:center;gap:11px;cursor:pointer}.task input{width:19px;height:19px;accent-color:#1b8b6c}.done{text-decoration:line-through;color:#82918e}.number{font-size:45px;font-weight:800;letter-spacing:-1.4px;margin:12px 0}.pupils{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.pupil{padding:13px 5px;background:#eef4f0}.pupil.selected{background:#174254;color:white}.small{font-size:11px;color:#82918e;display:block;margin-top:5px;font-weight:400}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.actions button{padding:15px 3px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tags button{font-size:12px;padding:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:#eef4f0;padding:13px 5px;border-radius:13px}.stat strong{font-size:29px;display:block}.stat span{font-size:11px;color:#637979}.mutebox{background:#f1f6f3;border-radius:13px;padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:8px;background:#456275;border-radius:50px;overflow:hidden}.bar i{display:block;height:100%;background:#89dbb4}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 6px;border-bottom:1px solid #edf2ee;font-size:13px}.board{background:#eaf3e9;padding:24px;border-radius:20px;text-align:center}.board .number{font-size:clamp(50px,10vw,110px)}.board p{font-size:19px}.board .card{box-shadow:none}.linkrow{display:flex;gap:8px;flex-wrap:wrap}.foot{font-size:12px;color:#708186;margin:20px 0}.hidden{display:none}.kbd{color:#6a7779;font-size:12px}@media(max-width:690px){.grid{grid-template-columns:1fr}.container{padding:12px}.pupils{grid-template-columns:repeat(3,1fr)}.actions button{font-size:12px}.number{font-size:38px}}
</style></head>
<body><div id="app" class="container"></div>
<script>
"use strict";
// All records deliberately kept in volatile memory; refresh to clear.
const names=["Oliver","Amelia","Jack","Isla","Noah","Sophie"];
const tasks=["Date on board","Morning Maths","Register — Arbor","Dinner register","Living Streets Travel Tracker","Number Fact of the Day","Visual timetable","STAR — learning","Wonderful Walking / Legendary Lining Up","Check after-school clubs"];
const factSets={
"Number bonds":[["6 + 4 = 10","What other facts can you derive?","4 + 6 = 10, 10 − 6 = 4 and 10 − 4 = 6."],["7 + 3 = 10","Give the related subtraction facts.","10 − 7 = 3 and 10 − 3 = 7."],["8 + 2 = 10","How many to make ten from 8?","Two."],["9 + 1 = 10","What does adding one do?","It gives the next whole number."],["5 + 5 = 10","What do you notice?","This is both a number bond and a double."]],
"Bridging through ten":[["8 + 7 = 15","How do you make ten first?","8 + 2 = 10; 5 remains, so 10 + 5 = 15."],["9 + 6 = 15","Explain without counting in ones.","9 + 1 = 10, then 10 + 5 = 15."],["13 − 5 = 8","How can you subtract to ten?","13 − 3 = 10, then 10 − 2 = 8."],["12 − 4 = 8","Show two jumps on the number line.","12 − 2 = 10 and 10 − 2 = 8."],["7 + 8 = 15","How can we use a near double?","7 + 7 = 14, then add 1."]],
"Multiplication relationships":[["4 × 6 = 24","How can doubling help?","2 × 6 = 12, doubled is 24."],["3 × 5 = 15","What is one more group of 5?","4 × 5 = 20."],["6 × 2 = 12","What is the commutative fact?","2 × 6 = 12."],["5 × 4 = 20","How many in ten groups of 4?","10 × 4 = 40."],["8 × 3 = 24","How can four groups of 3 help?","4 × 3 = 12; doubling gives 24."]]};
let page="Today",selected=names[0],events=[],checked=new Set(),focus="Bridging through ten",fact=0,show=false,tag="",lastToast="";
const el=(tag,attrs={},children=[])=>{const x=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>k==="text"?x.textContent=v:k==="class"?x.className=v:k==="click"?x.addEventListener("click",v):x.setAttribute(k,v));for(const c of children)x.append(c);return x};
const add=(parent,tag,attrs={},kids=[])=>{const x=el(tag,attrs,kids);parent.append(x);return x};
const button=(parent,label,action,cls="")=>add(parent,"button",{text:label,class:cls,click:action});
const card=(parent,title,cls="")=>{const c=add(parent,"section",{class:"card "+cls});if(title)add(c,"h2",{text:title});return c};
const count=(p,t)=>events.filter(x=>(!p||p===x.p)&&(!t||t===x.type)).length;
const reset=()=>{events=[];checked=new Set();focus="Bridging through ten";fact=0;selected=names[0];tag="";show=false;page="Today";render()};
function renderHeader(root){let h=add(root,"header",{class:"header"});let l=add(h,"div");add(l,"div",{class:"logo",text:"☀ daymark teacher"});add(l,"div",{class:"sub",text:"SENDAK CLASS · YEAR 3"});add(h,"span",{class:"chip",text:"PRACTICE · FICTIONAL PUPILS"});let tabs=add(root,"nav",{class:"tabs"});for(const t of ["Today","Interactions","Reports","Whiteboard"])button(tabs,t,()=>{page=t;render()},page===t?"selected":"");}
function statBox(p){let s=add(p,"div",{class:"stats"});for(const [type,label] of [["positive","Positive"],["correction","Corrections"],["checkin","Check-ins"]]){let k=add(s,"div",{class:"stat"});add(k,"strong",{text:String(count(null,type))});add(k,"span",{text:label})}}
function todayPage(root){add(root,"h1",{text:"Your day, sorted."});let hero=card(root,"","hero");add(hero,"div",{class:"eyebrow",text:"NEXT ON YOUR CHECKLIST"});add(hero,"h2",{text:tasks.find((_,i)=>!checked.has(i))||"Everything ticked off!"});add(hero,"p",{class:"sub",text:checked.size+" of "+tasks.length+" tasks complete"});let bar=add(hero,"div",{class:"bar"});let i=add(bar,"i");i.style.width=(checked.size/tasks.length*100)+"%";let g=add(root,"div",{class:"grid"}),left=add(g,"div"),right=add(g,"div");let c=card(left,"Today's essentials");tasks.forEach((t,i)=>{let r=add(c,"div",{class:"task"}),lab=add(r,"label"),ch=add(lab,"input",{type:"checkbox"});ch.checked=checked.has(i);ch.addEventListener("change",()=>{ch.checked?checked.add(i):checked.delete(i);render()});add(lab,"span",{text:t,class:checked.has(i)?"done":""});if(i===2)button(r,"Open ↗",()=>window.open("https://login.arbor.sc/","_blank","noopener"),"");if(i===4)button(r,"Open ↗",()=>window.open("https://www.traveltracker.org.uk/en-gb/accounts/login/","_blank","noopener"),"")});let r=card(left,"Outwoods routines");add(r,"p",{text:"STAR: Sit up · Track the speaker · Active listening · Respond"});add(r,"p",{text:"Rules: Be Ready · Be Respectful · Aim High"});add(r,"p",{text:"Values: Daring · Responsibility · Ambition"});add(r,"p",{text:"Wonderful Walking · Legendary Lining Up · Awesome Appearance"});
let f=card(right,"Number Fact of the Day");factCard(f);let quick=card(right,"Teacher shortcuts");let links=add(quick,"div",{class:"linkrow"});button(links,"Arbor ↗",()=>window.open("https://login.arbor.sc/","_blank","noopener"),"btnprimary");button(links,"Living Streets ↗",()=>window.open("https://www.traveltracker.org.uk/en-gb/accounts/login/","_blank","noopener"));let s=card(right,"Interaction snapshot");statBox(s);button(s,"Open tracker",()=>{page="Interactions";render()},"btnprimary");}
function factCard(parent){let select=add(parent,"select",{"aria-label":"Choose Mastering Number focus"});Object.keys(factSets).forEach(k=>{let op=add(select,"option",{value:k,text:k});op.selected=k===focus});select.addEventListener("change",()=>{focus=select.value;fact=0;show=false;render()});const f=factSets[focus][fact];add(parent,"div",{class:"eyebrow",text:"YEAR 3 · SAMPLE TEACHING PROMPT"});add(parent,"div",{class:"number",text:f[0]});add(parent,"p",{text:f[1]});let b=add(parent,"div",{class:"linkrow"});button(b,show?"Hide explanation":"Reveal explanation",()=>{show=!show;render()},"btnprimary");button(b,"Another fact",()=>{fact=(fact+1)%5;show=false;render()});if(show)add(parent,"p",{class:"mutebox",text:f[2]});add(parent,"p",{class:"sub",text:"Original practice examples; choose the focus matching your Mastering Number session."})}
function interactionPage(root){add(root,"h1",{text:"Interaction Tracker"});add(root,"p",{class:"sub",text:"Select a fictional pupil. Positive, correction or check-in takes just two taps."});let c=card(root,"Choose a pupil"),grid=add(c,"div",{class:"pupils"});for(const name of names){let b=button(grid,name,()=>{selected=name;render()},selected===name?"pupil selected":"pupil");add(b,"span",{class:"small",text:count(name,null)+" recorded"})}let rec=card(root,"Record for "+selected),acts=add(rec,"div",{class:"actions"});for(const [type,label] of [["positive","＋ Positive"],["correction","－ Correction"],["checkin","♡ Check-in"]])button(acts,label,()=>{events.push({p:selected,type,tag});tag="";render()},type);
add(rec,"p",{class:"sub",text:"Optional rule or value tag (select before recording):"});let tags=add(rec,"div",{class:"tags"});for(const t of ["Be Ready","Be Respectful","Aim High","Daring","Responsibility","Ambition"])button(tags,t,()=>{tag=tag===t?"":t;render()},tag===t?"selected":"");if(events.length){const x=events.at(-1);add(rec,"p",{class:"sub",text:"Last: "+x.p+" · "+x.type+(x.tag?" · "+x.tag:"")});button(rec,"Undo last entry",()=>{events.pop();render()})}}
function reportPage(root){add(root,"h1",{text:"End-of-day reflection"});add(root,"p",{class:"sub",text:"A record of taps, not a complete account of classroom behaviour."});let s=card(root,"Interactions logged");statBox(s);let c=card(root,"Class overview"),tbl=add(c,"table",{class:"table"});let tr=add(tbl,"tr");for(const h of ["Pupil","Positive","Correction","Check-in"])add(tr,"th",{text:h});for(const n of names){let row=add(tbl,"tr");add(row,"td",{text:n});for(const t of ["positive","correction","checkin"])add(row,"td",{text:String(count(n,t))})}let untouched=names.filter(n=>count(n,null)===0);let ref=card(root,"Reflection");add(ref,"p",{text:untouched.length?untouched.join(", ")+" have no recorded interactions in this demo. Could anyone benefit from some positive attention?":"You've logged at least one interaction for every fictional pupil."});const t=events.filter(x=>x.tag);add(ref,"p",{class:"sub",text:t.length+" interactions tagged with a school rule or value."});button(ref,"Reset demo",reset,"correction")}
function whiteboardPage(root){let w=add(root,"div",{class:"board"});add(w,"h1",{text:"Sendak Class"});add(w,"p",{text:"Our learning today"});let f=card(w,"Number Fact of the Day");factCard(f);let r=card(w,"STAR learning");add(r,"p",{text:"Sit up · Track the speaker · Active listening · Respond"});let v=card(w,"Our school rules");add(v,"p",{text:"Be Ready · Be Respectful · Aim High"});add(v,"p",{class:"sub",text:"Daring · Responsibility · Ambition"});add(w,"p",{class:"sub",text:"This display has no pupil names or interaction data."})}
function render(){const root=document.getElementById("app");root.replaceChildren();renderHeader(root);({Today:todayPage,Interactions:interactionPage,Reports:reportPage,Whiteboard:whiteboardPage})[page](root);add(root,"footer",{class:"foot",text:"Practice only • No accounts • No database • No saved pupil information • Reloading clears the demo. Not for real pupil records."})}
try { render(); } catch (error) { document.getElementById("app").textContent = "Daymark could not load. Please report this error: " + error.message; console.error(error); }
</script></body></html>
